# The ten-step journey (SYSTEM_DESIGN.md §2.3, §21.9, T-110) against the compose stack with fake data:
# Home → Discover → filters → NVDA → Signal → proposal → sizing → hold 1.2 s → fill receipt → Portfolio NEW →
# Position → Generated by → strategy backtest, then Activity and Home reflect the fill.
#   node e2e/scripts/create-user.mjs        # once: prints EMAIL=… PASSWORD=…
#   maestro --device <udid> test -e EMAIL=… -e PASSWORD=… e2e/journey.yaml
# journey-setup.js forces a regular session (Development-only /dev/faults) and resets the paper account, so the run
# works at any hour and repeats cleanly.
appId: ${APP_ID}
env:
  APP_ID: app.astryx.mobile
  LINK: astryx://
  API_URL: http://localhost:5080
  DEV_CLIENT_URL: exp+astryx://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081&disableOnboarding=1
---
- runScript:
    file: scripts/journey-setup.js
    env:
      API_URL: ${API_URL}
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- repeat: # until the quote sync has stored the E2E price (at most ~2 minutes)
    times: 24
    while:
      true: ${!output.quoteReady}
    commands:
      - runScript:
          file: scripts/journey-quote.js
          env:
            API_URL: ${API_URL}
      - extendedWaitUntil: # a 5 s pause: Maestro has no sleep
          visible: __never_visible__
          timeout: 5000
          optional: true
- assertTrue: ${output.quoteReady}
- launchApp: # a fresh start: no sheet from an earlier run (the session comes back from the Keychain)
    stopApp: true
- openLink: ${DEV_CLIENT_URL} # load the bundle from Metro rather than the dev client's server picker
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: "Sign in|Overview"
    timeout: 60000
- extendedWaitUntil: # the dev client opens its menu a few seconds after a cold launch
    visible:
      id: xmark
    timeout: 20000
    optional: true
- runFlow: close-dev-menu.yaml
- runFlow:
    file: sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
- runFlow: close-dev-menu.yaml

# 1. Home
- openLink: ${LINK}
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Overview
    timeout: 30000
- runFlow: close-dev-menu.yaml # the dev client may open its menu a few seconds after launch
- takeScreenshot: journey-01-home

# 2–3. Discover and its filters (Score 70+ keeps NVDA)
- tapOn:
    id: tab-discover
- extendedWaitUntil:
    visible: "All, \\d+"
    timeout: 30000
- tapOn: "All, \\d+"
- runFlow:
    when:
      visible: Clear all
    commands:
      - tapOn: Clear all
- runFlow: close-dev-menu.yaml
- tapOn:
    id: discover-filters
- extendedWaitUntil:
    visible: "Show \\d+ setups?"
    timeout: 10000
- tapOn: "70+"
- tapOn:
    id: filters-apply
- extendedWaitUntil:
    visible:
      id: opportunity-NVDA
    timeout: 15000
- takeScreenshot: journey-02-discover

# 4–5. NVDA, Signal tab, review the proposal
- tapOn:
    id: opportunity-NVDA
- extendedWaitUntil:
    visible:
      id: stock-review-proposal
    timeout: 30000
- tapOn: Signal
- takeScreenshot: journey-03-signal
- tapOn:
    id: stock-review-proposal

# 6. Proposal and sizing: change the risk, wait for the server's re-assessment
- extendedWaitUntil:
    visible:
      id: proposal-banner
    timeout: 30000
- scrollUntilVisible:
    element: "0.50%"
    direction: DOWN
    timeout: 15000
- tapOn: "0.50%"
- tapOn: "0.75%"
- extendedWaitUntil:
    visible:
      id: proposal-approve
      enabled: true
    timeout: 20000
- takeScreenshot: journey-04-proposal

# 7. Confirm and hold to approve (≥ 1.2 s)
- tapOn:
    id: proposal-approve
- extendedWaitUntil:
    visible:
      id: confirm-order-sheet
    timeout: 10000
- takeScreenshot: journey-05-confirm
- longPressOn:
    id: hold-to-approve

# 8. Fill receipt
- extendedWaitUntil:
    visible:
      id: fill-receipt
    timeout: 20000
- assertVisible: "EXECUTED · SIMULATED FILL.*"
- assertVisible: "Bought \\d+ NVDA at .*"
- waitForAnimationToEnd # the sheet ignores touches while it slides up
- takeScreenshot: journey-06-receipt
- repeat: # the sheet ignores touches until its spring settles; tap until it closes
    times: 5
    while:
      visible:
        id: fill-receipt
    commands:
      - tapOn:
          id: receipt-view-portfolio
          optional: true
      - extendedWaitUntil:
          notVisible:
            id: fill-receipt
          timeout: 2000
          optional: true

# 9. Portfolio: the NVDA position with its NEW badge
- extendedWaitUntil:
    visible:
      id: position-NVDA
    timeout: 20000
- assertVisible: # the NEW badge, as the row announces it
    id: position-NVDA
    text: "NVDA, new, .*"
- takeScreenshot: journey-07-portfolio

# 10. Position → Generated by → strategy backtest
- tapOn:
    id: position-NVDA
- extendedWaitUntil:
    visible:
      id: generated-by
    timeout: 20000
- takeScreenshot: journey-08-position
- scrollUntilVisible:
    element:
      id: generated-by
    direction: DOWN
    timeout: 10000
- tapOn:
    id: generated-by
- extendedWaitUntil:
    visible: Base Breakout v3
    timeout: 20000
- tapOn: Backtest
- extendedWaitUntil:
    visible:
      id: backtest-tab
    timeout: 20000
- assertVisible: "Shaded: out of sample from .*"
- takeScreenshot: journey-09-backtest

# Afterwards: Activity has the fill, and Home no longer asks about the proposal
- openLink: ${LINK}activity
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: "Filled \\(simulated\\) · NVDA\\..*" # the row reads "title. body"
    timeout: 20000
- takeScreenshot: journey-10-activity
- openLink: ${LINK}
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Overview
    timeout: 20000
- assertNotVisible: NVDA proposal waiting

- runScript:
    file: scripts/journey-teardown.js
    env:
      API_URL: ${API_URL}
