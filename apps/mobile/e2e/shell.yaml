# Walks the app shell while signed in (run sign-in.yaml first): Home header, every tab, a pushed screen, Search.
appId: ${APP_ID}
env:
  APP_ID: app.astryx.mobile # dev client (T-036); Expo Go: -e APP_ID=host.exp.Exponent -e LINK=exp://127.0.0.1:8081/--/
  LINK: astryx://
---
- openLink: ${LINK}
- extendedWaitUntil: # iOS may ask before handing a custom-scheme link to the app
    visible: "Open|Sign in|Overview|Back" # whole-label match
    timeout: 30000
- tapOn:
    text: Open
    optional: true
- runFlow: close-dev-menu.yaml
- tapOn:
    text: Back # a deep link replayed after sign-in may be on top of Home
    optional: true
- extendedWaitUntil:
    visible: Overview
    timeout: 30000
- assertVisible:
    id: paper-chip
- takeScreenshot: home
- runFlow: close-dev-menu.yaml
- tapOn:
    id: tab-discover
- extendedWaitUntil:
    visible:
      id: scanner-status
    timeout: 15000
- runFlow: close-dev-menu.yaml
- tapOn:
    id: tab-portfolio
- assertVisible: "(?i)not implemented · 09, 15"
- assertVisible:
    id: paper-chip
- takeScreenshot: portfolio
- runFlow: close-dev-menu.yaml
- tapOn:
    id: tab-strategies
- assertVisible: "(?i)not implemented · 13, 14"
- runFlow: close-dev-menu.yaml
- tapOn:
    id: tab-activity
- assertVisible: "(?i)not implemented · 17"
- runFlow: close-dev-menu.yaml
- tapOn:
    id: tab-index
- tapOn: Stock · NVDA
- extendedWaitUntil:
    visible:
      id: stock-price
    timeout: 15000
- tapOn: Back
- assertVisible: Overview
- runFlow: close-dev-menu.yaml
- tapOn:
    id: header-search
- tapOn:
    id: search-input
- inputText: am
- extendedWaitUntil:
    visible:
      id: search-result-AMZN
    timeout: 10000
- assertVisible:
    id: search-result-AMD
- takeScreenshot: search
- tapOn:
    id: search-result-AMD
- extendedWaitUntil:
    visible:
      id: stock-price
    timeout: 15000 # Stock screen arrives with T-049
- tapOn: Back
- assertVisible: Overview
- tapOn:
    id: header-alerts
- assertVisible: filter=alerts
- runFlow: close-dev-menu.yaml
- tapOn:
    id: tab-index
- tapOn:
    id: header-settings
- assertVisible: "(?i)not implemented · 18, 25"
