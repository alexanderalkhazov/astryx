# Signs in through the real form (dev client or Expo Go, with Metro on :8081). Lands on Home, or on a deep link stashed before sign-in.
#   maestro --device <udid> test -e EMAIL=… -e PASSWORD=… e2e/sign-in.yaml
appId: ${APP_ID}
env:
  APP_ID: app.astryx.mobile # dev client (T-036); Expo Go: -e APP_ID=host.exp.Exponent -e LINK=exp://127.0.0.1:8081/--/
  LINK: astryx://
---
- openLink: ${LINK}sign-in
- extendedWaitUntil: # iOS may ask before handing a custom-scheme link to the app
    visible: "Open|Sign in|Overview|Back" # whole-label match
    timeout: 30000
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: "Sign in|Overview|Back" # whole-label match
    timeout: 30000
# Already signed in: the auth gate has left the sign-in screen, so there is nothing to do.
- runFlow:
    when:
      visible:
        id: sign-in-submit
    commands:
      - tapOn:
          id: sign-in-email
      - inputText: ${EMAIL}
      - tapOn:
          id: sign-in-password
      - inputText: ${PASSWORD}
      - tapOn:
          id: sign-in-submit
      - tapOn:
          text: Not Now # iOS "Save Password?" prompt
          optional: true
      - extendedWaitUntil:
          notVisible:
            id: sign-in-submit
          timeout: 15000
# A fresh account sees the onboarding disclaimer once (T-118).
- extendedWaitUntil:
    visible:
      id: disclaimer-accept
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: disclaimer-accept
    commands:
      - tapOn:
          id: disclaimer-accept
