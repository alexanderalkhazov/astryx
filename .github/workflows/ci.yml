# Continuous integration (TASKS.md T-001, SYSTEM_DESIGN.md §21.2).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore Astryx.slnx --locked-mode

      - name: Format (dotnet format --verify-no-changes)
        run: dotnet format Astryx.slnx --no-restore --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build Astryx.slnx -c Release --no-restore

      # Integration tests start postgres:17 via Testcontainers (Docker is available on ubuntu runners).
      - name: Test
        run: dotnet test Astryx.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults

  mobile:
    name: Mobile & packages (typecheck, lint, format, expo-doctor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # T-010: the backend job's OpenApiDriftTests keep apps/api/openapi.json in step with the code; this keeps the
      # generated TypeScript in step with that document. Fix either with `pnpm stack:up && pnpm api:gen`.
      - name: Generated API types match openapi.json
        run: |
          pnpm --filter @astryx/api-client exec openapi-typescript ../../apps/api/openapi.json --output src/generated/schema.ts
          git diff --exit-code -- packages/api-client/src/generated || { echo "::error::packages/api-client/src/generated is stale: run pnpm api:gen and commit it."; exit 1; }

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (ESLint, zero warnings)
        run: pnpm lint

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Expo doctor
        working-directory: apps/mobile
        # The SDK version check compares against Expo's live list, so every new patch release would fail CI, and the
        # project only takes versions at least two weeks old. `npx expo install --check` reviews versions by hand.
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npx --yes expo-doctor

  security:
    name: Security (secrets + vulnerable dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip

      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --exit-code 1

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Vulnerable NuGet packages (any severity fails)
        run: |
          dotnet restore Astryx.slnx --locked-mode
          dotnet list Astryx.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Production dependencies only; high and critical fail. Moderate advisories in Expo's build tooling are tracked
      # through Dependabot rather than blocking every build.
      - name: Vulnerable npm packages (high or critical fails)
        run: pnpm audit --prod --audit-level high
