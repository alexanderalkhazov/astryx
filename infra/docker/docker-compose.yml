# Local development stack (SYSTEM_DESIGN.md §22.1).
# Ollama runs natively on macOS (Metal GPU) and is reached via host.docker.internal.
name: astryx
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: astryx
      POSTGRES_USER: astryx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astryx -d astryx"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  # OpenTelemetry collector and viewer for traces, metrics and logs (SYSTEM_DESIGN.md §23, T-113): http://localhost:18888
  otel:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports: ["18888:18888"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: astryx-api:dev
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["${API_PORT:-5080}:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=astryx;Username=astryx;Password=${POSTGRES_PASSWORD}
      Ai__Provider: ${AI_PROVIDER:-Ollama}
      Ai__Ollama__BaseUrl: http://host.docker.internal:11434
      Ai__Ollama__Model: ${OLLAMA_MODEL:-qwen3.5:0.8b}
      MarketData__Provider: ${MARKET_DATA_PROVIDER:-Fake} # Alpaca for real data (needs ALPACA_KEY_ID / ALPACA_SECRET_KEY)
      MarketData__Ingestion__RequestsPerMinute: ${MARKET_DATA_REQUESTS_PER_MINUTE:-6000} # Alpaca: 80 provider calls stays under its 200 req/min
      Alpaca__KeyId: ${ALPACA_KEY_ID:-}
      Alpaca__SecretKey: ${ALPACA_SECRET_KEY:-}
      Credentials__MasterKeys: ${CREDENTIALS_MASTER_KEYS:-} # wraps stored broker keys (§17.6): dotnet run --project apps/api -- --generate-credentials-key
      Jwt__SigningKeys: ${JWT_SIGNING_KEYS:?set JWT_SIGNING_KEYS in .env}
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Features__DevFaultInjection: "true"
      Serilog__MinimumLevel__Default: ${LOG_LEVEL:-Debug} # the load test measures at Information
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      Sentry__Dsn: ${SENTRY_DSN:-} # error tracking stays off unless set in .env
      # Every local client shares one IP: the simulator, Maestro's setup scripts and curl. Production keeps 10/min · 50/h.
      # The load test raises them further for its run: AUTH_PER_MINUTE=100000 AUTH_PER_HOUR=1000000 pnpm stack:up.
      RateLimits__AuthPerMinute: ${AUTH_PER_MINUTE:-60}
      RateLimits__AuthPerHour: ${AUTH_PER_HOUR:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
